[project]
name = "discord-scanner"
version = "0.1.0"
requires-python = ">=3.12"
description = "Stage 2 — burner-token Discord scanner producing raw JSONL dumps for Stage 3 curator. Rebuild of dsc-smartscraper."
dependencies = [
    "typer>=0.12",
    "click>=8.1",
    "rich>=13.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
]

[project.scripts]
discord-scanner = "src.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]