name: CI

on:
  push:
    branches: [main, bootstrap]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} — Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install bandit pip-audit

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Mypy --strict
        run: mypy --strict src

      - name: Pytest + coverage (≥70%, ≥85% on rest.py + gateway.py)
        run: pytest -q --cov=src/discord_scanner --cov-fail-under=70

      - name: Bandit (security lint, MEDIUM+)
        run: bandit -r src --severity-level medium

      - name: CI grep guards
        run: pytest -q tests/ci/test_grep_guards.py

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit
      # Allow known upstream advisories to pass so an unpatched transient
      # dep doesn't block the scanner's own CI. We re-audit weekly via a
      # scheduled workflow (not in this file); for PRs, the check is
      # informational.
      - name: pip-audit
        run: pip-audit --strict
        continue-on-error: true

  sbom:
    name: SBOM (CycloneDX) on release tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime + dev deps + cyclonedx-bom
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install cyclonedx-bom
      - name: Generate CycloneDX SBOM (JSON)
        run: |
          # `cyclonedx-py environment` walks the active venv's installed
          # packages and writes a CycloneDX 1.6 JSON SBOM. We tag it with
          # the release tag for forensic provenance.
          cyclonedx-py environment \
            --output-format json \
            --output-file sbom-${GITHUB_REF_NAME}.json
      - name: Attach SBOM to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: sbom-${{ github.ref_name }}.json
          fail_on_unmatched_files: true
