name: Deploy — Staging

on:
  push:
    branches: [main]

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      # --- Docker-based deploy (default) ---
      # Customize this section based on your deployment target.
      # Common targets: Fly.io, Railway, Render, self-hosted Docker host.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Run migrations on staging ---
      # Replace with your actual staging deploy command.
      # Example: SSH to host, pull image, run `docker compose up -d`
      - name: Deploy to staging host
        run: |
          echo "TODO: Replace with real deploy command"
          echo "Example: ssh deploy@staging.example.com 'cd /app && docker compose pull && docker compose up -d'"
